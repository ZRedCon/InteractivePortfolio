<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Interactive Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Jaro:opsz@6..72&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" class="native-dark-class-original">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
	<link rel="shortcut icon" href="assets/images/famicons/famicon-16.png" type="image/x-icon" sizes="16x16">
    <link rel="shortcut icon" href="assets/images/famicons/famicon-32.png" type="image/x-icon" sizes="32x32">
    <link rel="shortcut icon" href="assets/images/famicons/famicon-48.png" type="image/x-icon" sizes="48x48">
    <link rel="stylesheet" href="styles/default-styles.css">
    <link rel="stylesheet" href="styles/exhibit.css">
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="./styles/filters.css">
    <script src="src/main.js" type="module"></script>
</head>
<body>
    <h1 class="jaro-title">Welcome to the Museum!</h1>
    <iframe id="godot-frame" src="godot/index.html" title="Interactive Portfolio" loading="lazy" allowfullscreen></iframe>

    <p>In case you're concered, the information provided on this web portfolio is the exact same as the interactive one, just formated more traditionally</p>

    <div id="filters" class="ibm-plex-serif-regular">
        <h2>Filters</h2>
        <hr>
        <h3>Age:</h3>
        <section class="filter-selectors">
            <button type="button" id="newest" class="btn-off no-double-tap" disabled>Newest</button>
            <button type="button" id="oldest" class="btn-on no-double-tap">Oldest</button>
        </section>

        <h3>Skills:</h3>
        <section id="skill-buttons" class="filter-selectors">
            <button type="button" id="g-design" class="btn-off">Game Design</button>
            <button type="button" id="g-dev" class="btn-off">Game Dev</button>
            <button type="button" id="prog" class="btn-off">Programming</button>
            <button type="button" id="web" class="btn-off">Web Design & Dev</button>
            <button type="button" id="music" class="btn-off">Music Comp</button>
            <button type="button" id="audio" class="btn-off">Audio Design</button>
            <button type="button" id="art" class="btn-off">Art</button>
            <button type="button" id="ui-x" class="btn-off">UI/UX</button>
            <button type="button" id="prod" class="btn-off">Production</button>
        </section>
        <section class="filter-selectors">
            <button type="reset" id="all" class="btn-off no-double-tap" disabled>Select All</button>
            <button type="button" id="none" class="btn-on no-double-tap">Clear</button>
        </section>
        
    </div>
    <div id="exhibits" class="ibm-plex-serif-regular"></div>

</body>
</html>
