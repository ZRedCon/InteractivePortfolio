[plugin]

name="Map Painter"
description="Tools for the museum map (a TileMapLayer that uses MuseumSet.png). Map draws halls and rooms by dragging, which pick their own tiles and rotations and only join where a drag crosses between tiles. Room Groups marks blocks of tiles that are built as one scene instead of as rooms. Props places exhibits and other props."
author="ZRedCon"
version="1.1"
script="plugin.gd"
